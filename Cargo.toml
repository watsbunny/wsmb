[workspace]
resolver = "2"
members = ["crates/wsmb-core", "crates/wsmb-gpu", "crates/wsmb-ofx", "crates/wsmb-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/watsbunny/wsmb"
authors = ["Watsbunny"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
